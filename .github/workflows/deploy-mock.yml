# Deploy the TMDB mock API to Cloudflare Workers.
# Requires repository secrets:
#   CLOUDFLARE_API_TOKEN  — API token with Workers Edit
#   CLOUDFLARE_ACCOUNT_ID — optional if only one account on the token
name: Deploy mock API

on:
  push:
    branches: [main]
    paths:
      - 'mock-api/**'
      - '.github/workflows/deploy-mock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Deploy mock-api to Cloudflare Workers
        working-directory: mock-api
        # Pin wrangler via package.json/package-lock (devDependency), not @master
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

# Deploy Movies app + VitePress learn site to GitHub Pages
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Build movies site
        run: npm run build
        env:
          BASEPATH: /playwright-movies-app
          NEXT_PUBLIC_BASEPATH: /playwright-movies-app
          # Override via repo variable NEXT_PUBLIC_TMDB_API_BASE_URL if needed.
          NEXT_PUBLIC_TMDB_API_BASE_URL: ${{ vars.NEXT_PUBLIC_TMDB_API_BASE_URL != '' && vars.NEXT_PUBLIC_TMDB_API_BASE_URL || 'https://playwright-tmdb-mock.zephyrwmf.workers.dev' }}
      - name: Build learn docs
        run: npm run docs:build
        env:
          DOCS_BASE: /playwright-movies-app/learn/
      - name: Merge app and learn site
        run: |
          mkdir -p site
          cp -R movies-app/out/. site/
          mkdir -p site/learn
          cp -R .vitepress/dist/. site/learn/
          ls -la site
          ls -la site/learn | head
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
